# ──────────────────────────────────────────────────────────────────────────────
# Generates the contribution "snake" SVG and pushes it to the `output` branch.
# The README embeds it from:
#   https://raw.githubusercontent.com/hum4id/hum4id/output/github-contribution-grid-snake*.svg
# Runs every 12h + on manual dispatch + on push to main.
# ──────────────────────────────────────────────────────────────────────────────
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#4361EE&color_dots=#0B0C10,#1F2833,#2c5aa8,#4361EE,#7aa2f7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
