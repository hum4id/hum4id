# ──────────────────────────────────────────────────────────────────────────────
# lowlighter/metrics — generates 3 plugin SVGs and commits them to the repo root:
#   metrics.plugin.isocalendar.fullyear.svg   (isometric contribution calendar)
#   metrics.plugin.languages.indepth.svg      (most-used + recently-used languages)
#   metrics.plugin.skyline.svg                (3D contribution skyline)
# The README embeds these three files. Runs daily + manual + on push to main.
#
# SETUP (one time):
#   1. Create a classic Personal Access Token (PAT) with scopes: repo, read:user,
#      read:org  →  https://github.com/settings/tokens
#   2. Repo → Settings → Secrets and variables → Actions → New repository secret
#        Name:  METRICS_TOKEN
#        Value: <your PAT>
#   3. Settings → Actions → General → Workflow permissions → Read and write.
# ──────────────────────────────────────────────────────────────────────────────
name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ── 1 · Isometric contribution calendar (full year) ──────────────────────
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: hum4id
          base: ""
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ── 2 · Most-used & recently-used languages (indepth linguist analysis) ───
      - name: Languages
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.plugin.languages.indepth.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: hum4id
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, tex, less, dockerfile
          plugin_languages_colors: github
